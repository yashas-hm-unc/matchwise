name: matchwise
description: "RA matching website"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  resize: ^1.0.0
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  gap: ^3.0.1
  auto_size_text: ^3.0.0
  flutter_riverpod: ^2.5.1
  oktoast: ^3.4.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_fonts: ^6.2.1
  firebase_crashlytics: ^4.1.3
  google_sign_in: ^6.2.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/anim/
    - assets/fonts/
    - assets/images/icons/

